%
% CircularCylinder-1 (M_inf = 20, R = 1), SU2 shock-fitting mode via
% UnDiFi-2D's outer loop (source/main.f's SU2 branch). Same freestream
% and boundary-marker setup as tests/CircularCylinder/su2_capturing/
% circularcylinder.cfg (the shock-capturing smoke test), but ITER=1 +
% RESTART_SOL=YES so each SU2_CFD invocation performs exactly one
% implicit pseudo-time step -- the SU2 analogue of EulFS's -itmax 1 --
% picking up from the restart state triangle2su2 just wrote and handing
% the result back to su22triangle. The moving fitted shock front (not
% SU2 itself) is what resolves the discontinuity in this mode.
%
% MESH_FILENAME/SOLUTION_FILENAME/RESTART_FILENAME use the fixed
% "su2case" basename that source/main.f's SU2 branch passes to
% triangle2su2/su22triangle every outer iteration (see main.f comment
% above the SU2 branch) -- not fname, which changes.
%
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
%
MACH_NUMBER= 20.0
AOA= 180.0
FREESTREAM_PRESSURE= 0.0017857142857142857
FREESTREAM_TEMPERATURE= 0.0017857142857142857
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 1.0
REF_DIMENSIONALIZATION= DIMENSIONAL
%
MARKER_EULER= ( bc3 )
MARKER_SUPERSONIC_INLET= ( bc1, 0.0017857142857142857, 0.0017857142857142857, -1.0, 0.0, 0.0 )
MARKER_SUPERSONIC_OUTLET= ( bc2, bc4 )
MARKER_PLOTTING= ( bc3 )
MARKER_MONITORING= ( bc3 )
%
% Fitting mode re-triangulates every outer iteration with the fitted
% shock front as an internal double-point seam (colours 5-10 per
% type.dat's colour>4 "-1" rows); MARKER_INTERNAL tells SU2 to parse
% and ignore these -- no physical BC enforced across the seam.
MARKER_INTERNAL= ( bc5, bc6, bc7, bc8, bc9, bc10 )
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.1
CFL_ADAPT= NO
%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= NO
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
ITER= 1
%
MESH_FILENAME= su2case.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= su2case_restart
RESTART_FILENAME= su2case_restart
READ_BINARY_RESTART= NO
TABULAR_FORMAT= CSV
OUTPUT_FILES= ( RESTART_ASCII )
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_ENERGY, LIFT, DRAG)
