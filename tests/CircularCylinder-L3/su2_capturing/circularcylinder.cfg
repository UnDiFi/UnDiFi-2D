%
% CircularCylinder-1 (M_inf = 20, R = 1) in shock-capturing mode, via
% the triangle2su2/su22triangle converters (UnDiFi-2D issue #3).
%
% Freestream state matches tests/CircularCylinder/na00.1.node exactly
% (rho=1, sqrt(rho)*H=0.50625, sqrt(rho)*u=-1, sqrt(rho)*v=0, gamma=1.4
% -- doc/userguide/040_solver.md's Z=(sqrt(rho),sqrt(rho)*H,sqrt(rho)*u,
% sqrt(rho)*v) convention), giving p=T=0.0017857142857142857,
% a=0.05, M=20 -- matching doc/userguide/060_tutorials.md's stated
% M_1=20 for this case exactly.
%
% FLUID_MODEL must be IDEAL_GAS, not the STANDARD_AIR default -- with
% STANDARD_AIR, SU2 silently ignores GAS_CONSTANT/GAMMA_VALUE and uses
% real air's R=287.058, which desyncs the restart file's nondim units
% (R=1) from the freestream/marker state (found the hard way: first
% run "converged" but to a physically inconsistent mixed-unit state).
%
% Boundary colours per tests/CircularCylinder/type.dat:
%   1 = inflow (supersonic), 2/4 = outflow (supersonic), 3 = wall
%
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
%
MACH_NUMBER= 20.0
AOA= 180.0
FREESTREAM_PRESSURE= 0.0017857142857142857
FREESTREAM_TEMPERATURE= 0.0017857142857142857
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 1.0
REF_DIMENSIONALIZATION= DIMENSIONAL
%
MARKER_EULER= ( bc3 )
MARKER_SUPERSONIC_INLET= ( bc1, 0.0017857142857142857, 0.0017857142857142857, -1.0, 0.0, 0.0 )
MARKER_SUPERSONIC_OUTLET= ( bc2, bc4 )
MARKER_PLOTTING= ( bc3 )
MARKER_MONITORING= ( bc3 )
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.1
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 1.5, 0.1, 10.0, 0.001 )
%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= NO
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
ITER= 2000
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
%
MESH_FILENAME= na00.1.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= na00.1_restart
RESTART_FILENAME= na00.1_restart
READ_BINARY_RESTART= NO
TABULAR_FORMAT= CSV
OUTPUT_FILES= ( RESTART_ASCII, PARAVIEW )
OUTPUT_WRT_FREQ= 500
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_ENERGY, LIFT, DRAG)
SCREEN_WRT_FREQ_INNER= 50
